server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker a mapy se musí ověřovat pokaždé, jinak by po nasazení
    # zůstala v prohlížeči stará verze hry.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
